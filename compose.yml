services:

  db:
    image: mysql:latest
    platform: linux/amd64
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    ports:
      - "${DB_PORT}:3306"
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci'
    ]
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - wordpress-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      start_interval: 1s
      start_period: 30s
      timeout: 5s
      retries: 5

  wp:
    image: wordpress:${WP_VERSION}
    platform: linux/amd64
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    ports:
      - "${WP_PORT}:80"
    volumes:
      - ./data/php/php.conf.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./data/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./data/htdocs:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: ${WP_DEBUG}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', ${WP_DEBUG_LOG});
        define('WP_DEBUG_DISPLAY', ${WP_DEBUG_DISPLAY});
        define('SCRIPT_DEBUG', ${SCRIPT_DEBUG});
        define('SAVEQUERIES', true);
      XDEBUG_MODE: ${XDEBUG_MODE}
      XDEBUG_CONFIG: client_host=${XDEBUG_CLIENT_HOST} client_port=${XDEBUG_CLIENT_PORT}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wordpress-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 10s
      retries: 3

  wpcli:
    image: wordpress:cli
    platform: linux/amd64
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - ./data/htdocs:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wordpress-network
    command: tail -f /dev/null

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 256M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wordpress-network

networks:
  wordpress-network:
    driver: bridge
